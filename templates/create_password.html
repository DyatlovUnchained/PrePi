<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PrepPi — Create password</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="header">
    <div class="brand">
        <div class="logo"><img src="{{ url_for('static', filename='logo.png') }}" alt="PrepPi logo"></div>
        <div><h1>PrepPi</h1><p class="subtitle">SECURE YOUR HOUSEHOLD</p></div>
    </div>
</header>
<main>
    <section class="intro">
        <div>
            <p class="eyebrow">FIRST-RUN SECURITY</p>
            <h2>Create your household password.</h2>
            <p class="muted">This password protects access to your PrepPi dashboard.</p>
        </div>
    </section>
    {% if error %}
    <div class="settings-message error" role="alert">{{ error }}</div>
    {% endif %}
    <section class="panel settings-panel">
        <form method="post" class="settings-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="new-password" minlength="12" maxlength="256" required>
            <label for="confirm_password">Confirm password</label>
            <input id="confirm_password" name="confirm_password" type="password"
                   autocomplete="new-password" minlength="12" maxlength="256" required>
            <p class="muted">Use at least 12 characters. A longer passphrase is recommended.</p>
            <button type="submit">Create password</button>
        </form>
    </section>
</main>
</body>
</html>
